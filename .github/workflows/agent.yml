name: Agente

# Agente gestore (agent.py), sempre al lavoro: sceglie le strategie migliori del momento (le candidate, e a opzione accesa le
# quasi candidate) per il conto carta, scarta quelle che vanno male, approva. Lo avvia l'orologio del server Cloudflare
# (worker/index.js: 00:41, 06:41, 12:41 e 18:41 UTC), perché le partenze programmate di GitHub ritardano anche di ore.
# Modalità (input "mode"): choices = solo le scelte; daily = prima rilancia il laboratorio sui dati nuovi (18:41, ogni giorno);
# full = anche il ricercatore, la prova finale per le strategie pronte (agent.py --unseal-plan: buone su carta, mai provate sui
# mesi tenuti da parte; una volta sola ciascuna) e il rapporto completo (la domenica, e quando lo avvii dall'app).
# Il controllo di salute (watchdog.py) avvisa se l'agente non gira da troppo.
# Regole, autonomia, profilo e stile: vedi agent.py. Il reale dell'agente richiede autonomia "live"
# E l'interruttore degli ordini veri acceso, entrambi dall'app.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'choices = solo scelte, daily = con laboratorio, full = anche ricercatore, prova finale e rapporto'
        type: choice
        options: [full, daily, choices]
        default: full

permissions:
  contents: write

# Registro degli eventi (events.py): i giri scrivono in events/AAAA-MM.jsonl
env:
  PT_EVENTS_DIR: events

jobs:
  lab:
    name: Laboratorio aggiornato
    if: inputs.mode != 'choices'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: lab-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Dati cifrati
        uses: ./.github/actions/data-key
        with:
          key: ${{ secrets.DATA_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests
      # Agente ricercatore: al massimo 2 varianti nuove a settimana da una grammatica chiusa, dichiarate prima del laboratorio
      - name: Ricercatore
        if: inputs.mode == 'full'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python research.py || echo "Ricercatore non riuscito, il laboratorio gira lo stesso"
      - name: Calcola (con la prova finale per le strategie pronte)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # la prova finale si fa una volta sola per strategia, e solo nel giro completo
          if [ "$MODE" = "full" ]; then UNSEAL="$(python agent.py --unseal-plan)"; else UNSEAL=""; fi
          echo "Prova finale: ${UNSEAL:-nessuna}" | tee -a "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086
          python strategy_lab.py --unseal $UNSEAL > /dev/null
      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lab_summary.json lab_registry.json validation/LABORATORIO.md
          for f in research.json events; do if [ -e "$f" ]; then git add "$f"; fi; done
          git commit -m "Agente: laboratorio aggiornato $(date -u +%Y-%m-%d_%H:%M)" || { echo "Nessuna modifica"; exit 0; }
          bash tools/push_state.sh

  agent:
    name: Scelte e rapporto
    needs: lab
    # gira anche quando il laboratorio è saltato (giorni feriali), non se è fallito
    if: ${{ !cancelled() && (needs.lab.result == 'success' || needs.lab.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # stesso gruppo dei comandi dell'app: automation.json cambia un comando alla volta
    concurrency:
      group: automation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Dati cifrati
        uses: ./.github/actions/data-key
        with:
          key: ${{ secrets.DATA_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installa dipendenze minime
        run: pip install "pandas>=2.2.2" numpy requests
      - name: Agente
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FULL: ${{ inputs.mode == 'full' }}
        run: |
          if [ "$FULL" = "true" ]; then python agent.py --full-report; else python agent.py; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation.json agent_state.json
          git add events 2>/dev/null || true
          git commit -m "Agente: scelte $(date -u +%Y-%m-%d_%H:%M)" || { echo "Nessuna modifica"; exit 0; }
          bash tools/push_state.sh
